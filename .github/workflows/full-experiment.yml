name: DIT5411 full-dataset experiment

on:
  push:
    branches: [assignment-completion]
    paths: ['.github/workflows/full-experiment.yml']

permissions:
  contents: read

concurrency:
  group: dit5411-full-experiment
  cancel-in-progress: false

jobs:
  train:
    name: Train and test model ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: [a, b, c]
    env:
      TF_NUM_INTRAOP_THREADS: '4'
      TF_NUM_INTEROP_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: python -m pip install 'tensorflow-cpu==2.19.1' 'keras==3.15.1' 'opencv-python-headless==4.11.0.86'
      - name: Prepare the verified archive
        run: |
          python download_data.py
          python prepare_data.py --archive data/all_data.zip
      - name: Train on 13,065 classes
        env:
          MODEL: ${{ matrix.model }}
        run: python train.py --model "$MODEL" --epochs 3 --batch-size 256
      - name: Measure the untouched holdout
        env:
          MODEL: ${{ matrix.model }}
        run: python evaluate.py --model "$MODEL" --batch-size 256 --metrics "metrics/$MODEL.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metrics-${{ matrix.model }}
          path: metrics/${{ matrix.model }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Verify and publish the results
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: metrics-*
          path: metrics
          merge-multiple: true
      - name: Validate and commit the report
        run: |
          python -m pip install 'tensorflow-cpu==2.19.1' 'keras==3.15.1'
          python collect_results.py metrics
          git add README.md reports/full-results.md reports/full-results.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --author="$(git log -1 --format='%an <%ae>' "$GITHUB_SHA")" \
              -m 'Report verified full-dataset handwriting results' \
              -m 'Co-authored-by: Perplexity <noreply@perplexity.ai>'
          git push origin HEAD:refs/heads/assignment-completion
